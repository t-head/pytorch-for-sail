name: zhenwu-build (reusable)

on:
  workflow_call:
    inputs:
      board:
        description: |
          Board type: 810 or 890.
          Appended as a suffix to build-environment and used in the cache key / artifact name
        type: string
        required: true
      build-environment:
        description: "Environment identifier prefix; the actual value is <build-environment>-<board>, used in the cache key / artifact name"
        type: string
        default: ppu-linux-ubuntu24.04-py3.12
      docker-image:
        description: Zhenwu PPU image used for building
        type: string
        default: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
      source-ref:
        description: "Ref to build; empty = PR head sha / current ref. Used to select the target branch when refreshing the cache"
        type: string
        default: ""
      cache-branch:
        description: |
          Branch name in the cache key; empty = PR base branch / current ref.
          Only pass it explicitly when refreshing the cache for another branch, and it must match the branch that source-ref points to; otherwise the seeded baseline
          will not match the prefix computed on the PR side (the PR side always uses its base branch name)
        type: string
        default: ""
      runner:
        description: "Runner label (requires 8 vCPU / 32GB class)"
        type: string
        default: x86-ubuntu2404-8-32
      max-jobs:
        description: "Build concurrency cap (MAX_JOBS)"
        type: string
        default: "8"
      ccache-maxsize:
        description: "ccache size limit; see the header of zhenwu-refresh-cache.yml for the quota math"
        type: string
        default: "4G"
      save-ccache:
        description: "Save ccache after a successful build (only zhenwu-refresh-cache.yml should enable this, see its header for why)"
        type: boolean
        default: false
      prune-old-ccache:
        description: "Delete old entries with the same prefix before saving, so baselines of two branches do not LRU-evict each other"
        type: boolean
        default: false
      ignore-ccache:
        description: "Skip restore and force a cold build (used to rebuild a clean baseline)"
        type: boolean
        default: false
      upload-wheel:
        description: Upload the whl artifact
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout; a cold build takes about 4~5h"
        type: number
        default: 350
    outputs:
      wheel-name:
        description: File name of the produced whl
        value: ${{ jobs.build.outputs.wheel-name }}
      artifact-name:
        description: "whl artifact name (still computed when upload-wheel=false, but not actually uploaded)"
        value: ${{ jobs.build.outputs.artifact-name }}
      ccache-key:
        description: Cache key written by this run
        value: ${{ jobs.build.outputs.ccache-key }}
      ccache-hit-rate:
        description: The Hits line from ccache -s
        value: ${{ jobs.build.outputs.ccache-hit-rate }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ inputs.build-environment }}-${{ inputs.board }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      wheel-name: ${{ steps.collect.outputs.wheel-name }}
      artifact-name: ${{ steps.collect.outputs.artifact-name }}
      ccache-key: ${{ steps.cache-meta.outputs.key }}
      ccache-hit-rate: ${{ steps.ccache-stats.outputs.hit-rate }}
    env:
      BUILD_ENVIRONMENT: ${{ inputs.build-environment }}-${{ inputs.board }}
      DOCKER_IMAGE: ${{ inputs.docker-image }}
      MAX_JOBS: ${{ inputs.max-jobs }}
      CCACHE_MAXSIZE: ${{ inputs.ccache-maxsize }}
      SDK_INSTALL_DIR: /usr/local
      PIP_INDEX_URL: ""
      REPO_DIR_IN_CONTAINER: /pytorch

    steps:
      - name: Validate board
        env:
          BOARD: ${{ inputs.board }}
        run: |
          # board determines the cache key suffix; a single typo means a wasted 4~5h build,
          # so fail at the first step instead of silently normalizing via a ternary in the job env
          case "${BOARD}" in
            810|890) echo "[board] board=${BOARD} env=${BUILD_ENVIRONMENT}" ;;
            *) echo "::error::board must be 810 or 890, got '${BOARD}'"; exit 1 ;;
          esac

      - name: Show runner spec
        run: |
          # A larger runner should show 8 vCPU / 32GB RAM / 300GB+ free on the root partition
          echo "[spec] runner-name=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          echo "[spec] nproc=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          echo "[spec] event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Wait before retry (checkout 1)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout PyTorch (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Record source baseline commit
        id: source-commit
        run: |
          # Use the actually checked-out HEAD so the artifact name maps one-to-one to the built source
          COMMIT=$(git rev-parse --short=7 HEAD)
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "[source] baseline commit=${COMMIT}"

      - name: Resolve ccache key
        id: cache-meta
        env:
          CACHE_BRANCH: ${{ inputs.cache-branch || github.event.pull_request.base.ref || github.ref_name }}
        run: |
          branch_slug=$(printf '%s' "${CACHE_BRANCH}" | tr -c '[:alnum:]._-' '-')
          # The fingerprint only covers the image: only an image change invalidates all old entries (compiler and
          # build flags changed). Do not include the hash of .ci/ppu/*.sh -- changing a log line would drop the whole cache
          fingerprint=$(
            printf '%s\n' "${DOCKER_IMAGE}" | sha256sum | cut -c1-12
          )
          prefix="ppu-ccache-${BUILD_ENVIRONMENT}-${branch_slug}-${fingerprint}-"
          echo "restore-prefix=${prefix}" >> "$GITHUB_OUTPUT"
          # GitHub cache entries cannot be overwritten and saving with the same key is skipped, so the key includes run id + attempt
          echo "key=${prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "branch-slug=${branch_slug}" >> "$GITHUB_OUTPUT"
          echo "[cache] branch=${CACHE_BRANCH} prefix=${prefix}"

      - name: Free disk space
        run: |
          avail_gb=$(df -Pk / | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          echo "[disk] Root partition free: ${avail_gb}GB"
          if [[ "${avail_gb}" -ge 150 ]]; then
            echo "[disk] Enough space, skipping cleanup"
            exit 0
          fi

          echo "[disk] Cleaning up preinstalled packages"
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          # Preinstalled content on hosted runners; none of it is needed for the Zhenwu PPU build (the build runs inside the container)
          $SUDO rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      /usr/share/miniconda \
                      /usr/local/lib/node_modules \
                      /usr/local/share/chromium \
                      /usr/local/share/boost \
                      /usr/lib/google-cloud-sdk \
                      /usr/lib/jvm \
                      /opt/hostedtoolcache || true
          $SUDO apt-get clean || true
          $SUDO docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== After cleanup ==="
          df -h /
          avail_gb=$(df -Pk / | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          if [[ "${avail_gb}" -lt 40 ]]; then
            echo "[disk] Warning: only ${avail_gb}GB left after cleanup, the image + build artifacts may fill up the disk" >&2
          fi

      - name: Restore ccache
        id: ccache
        if: ${{ !inputs.ignore-ccache }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ${{ steps.cache-meta.outputs.key }}
          restore-keys: ${{ steps.cache-meta.outputs.restore-prefix }}

      - name: Report ccache state
        env:
          MATCHED_KEY: ${{ steps.ccache.outputs.cache-matched-key }}
          IGNORED: ${{ inputs.ignore-ccache }}
        run: |
          if [[ "${IGNORED}" == "true" ]]; then
            echo "[cache] ignore-ccache=true -> skipping restore, cold build this run"
          elif [[ -z "${MATCHED_KEY}" ]]; then
            # The PR side never saves (see the file header for the scope reason), so only the cache refresh pipeline can fill this in
            echo "[cache] No ccache hit -> cold build this run (all misses)"
            echo "[cache] If the target branch has not been seeded yet, just wait for zhenwu-refresh-cache.yml to run once"
            echo "[cache]       (triggered on push when build code or .ci/ppu changes land / can also be triggered manually)"
          else
            echo "[cache] Hit ${MATCHED_KEY}"
            du -sh "${RUNNER_TEMP}/ppu-ccache" || true
          fi

      - name: Add swap
        continue-on-error: true
        run: |
          if [[ -n "$(swapon --show --noheadings 2>/dev/null)" ]]; then
            echo "[swap] swap already present, skipping"
            swapon --show
            exit 0
          fi

          # Prefer the temp disk /mnt (more space), fall back to the root partition otherwise
          swap_file=/mnt/ppu-swapfile
          if [[ ! -d /mnt ]]; then
            swap_file=/ppu-swapfile
          fi
          sudo fallocate -l 16G "${swap_file}" \
            || sudo dd if=/dev/zero of="${swap_file}" bs=1M count=16384 status=none
          sudo chmod 600 "${swap_file}"
          sudo mkswap "${swap_file}" >/dev/null
          sudo swapon "${swap_file}"
          # Only swap out when physical memory is really exhausted, to avoid slowing down the build normally
          sudo sysctl -w vm.swappiness=10 >/dev/null
          free -h

      - name: Pull docker image
        run: |
          # The private registry is occasionally flaky, retry 3 times
          for attempt in 1 2 3; do
            if docker pull "${DOCKER_IMAGE}"; then
              exit 0
            fi
            echo "[pull] Attempt ${attempt} failed, retrying in 60s" >&2
            sleep 60
          done
          echo "[pull] Unable to pull ${DOCKER_IMAGE}. Common causes:" >&2
          echo "[pull]   1) the image tag does not exist or has been cleaned up" >&2
          echo "[pull]   2) the registry has an allowlist restricting GitHub Azure egress IPs" >&2
          exit 1

      - name: Start build container
        id: container
        run: |
          # The cache directory must exist first: actions/cache does not create it on a restore miss,
          # and docker -v auto-creates a missing host path owned by root, which makes uploading harder later
          mkdir -p "${RUNNER_TEMP}/ppu-ccache"

          # The image ENTRYPOINT is unknown, explicitly override it with bash to keep the container alive;
          # 12h as a safety net so the container does not linger after the job is cancelled
          container_name=$(docker run \
            --detach \
            --tty \
            --entrypoint /bin/bash \
            -e REPO_DIR="${REPO_DIR_IN_CONTAINER}" \
            -e BUILD_ENVIRONMENT \
            -e MAX_JOBS \
            -e SDK_INSTALL_DIR \
            -e PIP_INDEX_URL \
            -e CCACHE_DIR=/root/.cache/ccache \
            -e CCACHE_MAXSIZE \
            --security-opt seccomp=unconfined \
            --cap-add=SYS_PTRACE \
            -v "${GITHUB_WORKSPACE}:${REPO_DIR_IN_CONTAINER}" \
            -v "${RUNNER_TEMP}/ppu-ccache:/root/.cache/ccache" \
            -w "${REPO_DIR_IN_CONTAINER}" \
            "${DOCKER_IMAGE}" \
            -c 'sleep 12h'
          )
          echo "container-name=${container_name}" >> "$GITHUB_OUTPUT"

          # The owner of the mounted source differs from the user inside the container, so git refuses to operate;
          # submodules are separate repos too, so allow all paths
          docker exec -t "${container_name}" bash -c \
            "git config --global --add safe.directory ${REPO_DIR_IN_CONTAINER} \
             && git config --global --add safe.directory '*'"

      - name: Setup ccache in container
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.container-name }}
        run: |
          # Install ccache and write its config here (the config file lives in the cache directory and travels with the cache);
          # sourcing it again in build_wheel.sh only verifies + exports env vars, it does not reinstall
          docker exec -t "${CONTAINER_NAME}" bash .ci/ppu/ccache_env.sh

          # Zero the counters so ccache -s after the build only reflects this run's hits (cache entries are unaffected);
          # use short options consistently, -z / -s / -c are the same on ccache 3.x and 4.x
          docker exec -t "${CONTAINER_NAME}" ccache -z \
            || echo "[ccache] Failed to zero stats (ccache unavailable?), does not affect the build" >&2

      - name: Build Zhenwu PPU torch wheel
        id: build
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.container-name }}
        run: |
          # Sample memory usage in the background (host and container share physical memory) so we can inspect it after an OOM kill
          mem_log="${RUNNER_TEMP}/mem-samples.log"
          ( while true; do
              printf '%s %s\n' "$(date -u +%H:%M:%S)" \
                "$(free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB ", $3, $7} /^Swap:/{printf "swap=%sMB", $3}')" \
                >> "${mem_log}"
              sleep 30
            done ) &
          sampler_pid=$!
          trap "kill ${sampler_pid} 2>/dev/null || true" EXIT

          set +e
          docker exec -t "${CONTAINER_NAME}" bash .ci/ppu/build_wheel.sh
          rc=$?
          set -e

          if [[ "${rc}" -ne 0 ]]; then
            if [[ "${rc}" -eq 137 ]]; then
              echo "::error::Build process was SIGKILLed (exit 137), almost certainly a host OOM"
              echo "[oom] Current MAX_JOBS=${MAX_JOBS}; if it keeps happening, lower max-jobs first" >&2
              echo "[oom] Tail of memory samples:" >&2
              tail -10 "${mem_log}" 2>/dev/null || echo "[oom] No sample data" >&2
            fi
            exit "${rc}"
          fi

          if docker exec "${CONTAINER_NAME}" test -f /tmp/ppu_build_duration_sec; then
            duration=$(docker exec "${CONTAINER_NAME}" cat /tmp/ppu_build_duration_sec | tr -d '\r\n')
            echo "build-time-sec=${duration}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump OOM diagnostics
        if: failure()
        continue-on-error: true
        run: |
          echo "=== OOM records in dmesg ==="
          sudo dmesg -T 2>/dev/null \
            | grep -iE "out of memory|killed process|oom-kill" \
            | tail -30 \
            || echo "(no dmesg permission or no OOM recorded)"
          echo "=== Memory / swap ==="
          free -h
          echo "=== Disk ==="
          df -h /
          echo "=== Memory samples (every 30s) ==="
          tail -40 "${RUNNER_TEMP}/mem-samples.log" 2>/dev/null || echo "(no sample data)"

      - name: Report ccache stats
        id: ccache-stats
        if: always() && steps.container.outputs.container-name != ''
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.container-name }}
        run: |
          # Trim to within max_size first to avoid uploading an over-quota cache (ccache's own cleanup is threshold-triggered)
          docker exec "${CONTAINER_NAME}" ccache -c >/dev/null 2>&1 || true

          # No -t: a pseudo-TTY inserts \r into the output, polluting GITHUB_OUTPUT / summary
          stats=$(docker exec "${CONTAINER_NAME}" ccache -s 2>/dev/null || true)
          if [[ -z "${stats}" ]]; then
            echo "[ccache] No stats output (ccache not enabled)"
            exit 0
          fi
          echo "${stats}"

          # ccache 4.x prints lines like "Hits: 12345 / 23456 (52.63 %)", extract the whole line as the hit rate
          hit_line=$(printf '%s\n' "${stats}" | grep -m1 -i '^ *Hits:' | tr -s ' ' | sed 's/^ //' || true)
          echo "hit-rate=${hit_line}" >> "$GITHUB_OUTPUT"

          {
            echo "<details><summary>ccache stats</summary>"
            echo ""
            echo '```'
            printf '%s\n' "${stats}"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect wheel
        id: collect
        env:
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.commit }}
          BUILD_TIME_SEC: ${{ steps.build.outputs.build-time-sec }}
          MATCHED_KEY: ${{ steps.ccache.outputs.cache-matched-key }}
          CCACHE_HIT_RATE: ${{ steps.ccache-stats.outputs.hit-rate }}
          CACHE_BRANCH: ${{ inputs.cache-branch || github.event.pull_request.base.ref || github.ref_name }}
          SAVE_CCACHE: ${{ inputs.save-ccache }}
        run: |
          # The container writes dist/ as root; the runner user needs read access to glob / upload the artifact;
          # chown must happen before the glob, otherwise an unreadable dist/ yields an empty result
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO chown -R "$(id -u):$(id -g)" dist 2>/dev/null || true

          shopt -s nullglob
          whls=(dist/torch-*.whl)
          if [[ ${#whls[@]} -eq 0 ]]; then
            echo "[collect] Error: no torch-*.whl under dist/" >&2
            ls -la dist 2>/dev/null || echo "[collect] dist directory does not exist" >&2
            exit 1
          fi

          wheel_name=$(basename "${whls[0]}")
          # Artifact names must not contain " : < > | * ? \ /, fold possible illegal characters into -
          env_slug=$(printf '%s' "${BUILD_ENVIRONMENT}" | tr -c '[:alnum:]._-' '-')
          echo "wheel-name=${wheel_name}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=ppu-wheel-${env_slug}-${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"

          {
            echo "### Zhenwu PPU build artifacts"
            echo ""
            echo "- Image: \`${DOCKER_IMAGE}\`"
            echo "- Baseline commit: \`${SOURCE_COMMIT}\`"
            echo "- Cache branch: \`${CACHE_BRANCH}\` (save: \`${SAVE_CCACHE}\`)"
            echo "- ccache cache: \`${MATCHED_KEY:-miss (cold build)}\`"
            echo "- ccache hits: \`${CCACHE_HIT_RATE:-no stats}\`"
            echo "- whl: \`${wheel_name}\` ($(du -h "${whls[0]}" | cut -f1))"
            echo "- Build time: \`${BUILD_TIME_SEC:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wheel artifact
        if: ${{ inputs.upload-wheel }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact-name }}
          path: dist/torch-*.whl
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Prepare ccache for upload
        if: ${{ success() && inputs.save-ccache }}
        run: |
          # The container writes the cache directory as root; the runner user needs read access to package and upload it
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/ppu-ccache" 2>/dev/null || true
          echo "[cache] ccache size to upload: $(du -sh "${RUNNER_TEMP}/ppu-ccache" | cut -f1)"

      - name: Prune old ccache entries
        if: ${{ success() && inputs.save-ccache && inputs.prune-old-ccache }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.cache-meta.outputs.restore-prefix }}
        run: |
          # The prefix already contains branch + environment + fingerprint, so everything listed here is a historical baseline of this branch
          ids=$(gh cache list --repo "${GITHUB_REPOSITORY}" --key "${PREFIX}" \
                  --limit 100 --json id --jq '.[].id' 2>/dev/null || true)
          if [[ -z "${ids}" ]]; then
            echo "[cache] No old entries with the same prefix (normal for the first seeding; listing requires actions:read permission)"
            exit 0
          fi
          for id in ${ids}; do
            echo "[cache] Deleting old entry id=${id}"
            gh cache delete "${id}" --repo "${GITHUB_REPOSITORY}" || true
          done

      - name: Save ccache
        if: ${{ success() && inputs.save-ccache }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ${{ steps.cache-meta.outputs.key }}

      - name: Skip ccache save
        if: ${{ success() && !inputs.save-ccache }}
        env:
          CACHE_BRANCH: ${{ inputs.cache-branch || github.event.pull_request.base.ref || github.ref_name }}
        run: |
          echo "[cache] This pipeline only reads the cache and never saves it."
          echo "[cache] Reason: entries written by a pull_request run belong to the refs/pull/<N>/merge scope, other PRs"
          echo "[cache]       cannot read any of them (regardless of the key name), they would just waste the 10GiB repo quota"
          echo "[cache]       and may LRU-evict the shared baseline."
          echo "[cache] The cross-PR shared baseline of ${CACHE_BRANCH} is maintained exclusively by zhenwu-refresh-cache.yml"
          echo "[cache]       (triggered on push when build code/scripts land + can be triggered manually)."

      - name: Report repo cache usage
        if: ${{ always() && inputs.save-ccache }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The steady state should be exactly one baseline per branch x board (guaranteed by prune), totaling within 10GiB.
          # If entries for refs/pull/<N>/merge show up here, someone enabled saving for PRs, which should be investigated.
          echo "=== Current ppu-ccache-* entries in this repo ==="
          gh cache list --repo "${GITHUB_REPOSITORY}" --key "ppu-ccache-" \
            --limit 50 2>/dev/null || echo "(listing requires actions:read permission)"

      - name: Teardown container
        if: always() && steps.container.outputs.container-name != ''
        continue-on-error: true
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.container-name }}
        run: |
          docker rm -f "${CONTAINER_NAME}" || true
          df -h /