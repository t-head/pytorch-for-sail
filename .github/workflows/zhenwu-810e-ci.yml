name: zhenwu-810e-ci

on:
  pull_request:
    branches:
      - 'v2.*'
    paths:
      - 'aten/**'
      - 'torch/**'
      - 'c10/**'
      - 'torchgen/**'
      - 'setup.py'
      - '.ci/ppu/**'
      - '.github/workflows/zhenwu-810e-ci.yml'
      - '.github/workflows/_zhenwu_build.yml'
  push:
    branches:
      - 'v2.*'
    paths:
      - 'aten/**'
      - 'torch/**'
      - 'c10/**'
      - 'torchgen/**'
      - 'setup.py'
      - '.ci/ppu/**'
      - '.github/workflows/zhenwu-810e-ci.yml'
      - '.github/workflows/_zhenwu_build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  NAMESPACE: ppu-sched
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  SOURCE_DIR: /workspace/source
  NODE_SELECTOR: "board-type=OAM-810E"
  PIP_INDEX: https://download.t-head.cn/artifactory/api/pypi/pypi_index/simple
  TRITON_VERSION: "3.6.0"
  WHEEL_DIR_REL: .ci/ppu/wheelhouse

jobs:
  build:
    uses: ./.github/workflows/_zhenwu_build.yml
    with:
      board: "810"
      upload-wheel: true

  smoke:
    name: zhenwu-smoke-test
    needs: build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120

    steps:
      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Wait before retry (checkout 1)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout PyTorch (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Download whl artifact
        id: download-wheel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Clean up before retry (1)
        if: steps.download-wheel.outcome == 'failure'
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
        run: |
          # v4 extracts while downloading, so an interruption can leave a truncated whl; if not cleaned up, after a retry
          # "Verify whl" may count a broken package that only blows up at pip install inside the pod (by then Zhenwu PPU cards are already held).
          rm -rf "${WHEEL_DIR}"
          sleep 30

      - name: Download whl artifact (retry 1)
        if: steps.download-wheel.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Verify whl is in place
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          count=0
          wheel=""
          for f in "${WHEEL_DIR}"/torch-*.whl; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            wheel="$f"
          done
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 torch-*.whl under ${WHEEL_DIR}, found ${count}"
            ls -la "${WHEEL_DIR}" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          wheel_name=$(basename "$wheel")
          echo "[wheel] ${wheel_name} ($(du -h "$wheel" | cut -f1))"
          {
            echo "### whl under test"
            echo ""
            echo "- Package: \`${wheel_name}\`"
            echo "- Source: ${BUILD_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "zhenwu-810e single card (1 Zhenwu PPU) CUDA smoke tests"
        uses: t-head/ppu-scheduler-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 60
          command: |
            PR_NUMBER="${{ github.event.pull_request.number }}" \
            WHEEL_DIR="${{ env.SOURCE_DIR }}/${{ env.WHEEL_DIR_REL }}" \
            SDK_INSTALL_DIR="/usr/local" \
            PIP_INDEX="${{ env.PIP_INDEX }}" \
            TRITON_INDEX="${{ env.PIP_INDEX }}" \
            TRITON_VERSION="${{ env.TRITON_VERSION }}" \
            bash ${{ env.SOURCE_DIR }}/.ci/ppu/smoke_test.sh

  perf:
    name: zhenwu-perf-test
    needs: build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 120

    steps:
      - name: Checkout PyTorch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Wait before retry (checkout 1)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout PyTorch (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Download whl artifact
        id: download-wheel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Clean up before retry (1)
        if: steps.download-wheel.outcome == 'failure'
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
        run: |
          rm -rf "${WHEEL_DIR}"
          sleep 30

      - name: Download whl artifact (retry 1)
        if: steps.download-wheel.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Verify whl is in place
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          count=0
          wheel=""
          for f in "${WHEEL_DIR}"/torch-*.whl; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            wheel="$f"
          done
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 torch-*.whl under ${WHEEL_DIR}, found ${count}"
            ls -la "${WHEEL_DIR}" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          wheel_name=$(basename "$wheel")
          echo "[wheel] ${wheel_name} ($(du -h "$wheel" | cut -f1))"
          {
            echo "### whl under test"
            echo ""
            echo "- Package: \`${wheel_name}\`"
            echo "- Source: ${BUILD_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "zhenwu-810e single card (1 Zhenwu PPU) CUDA inductor performance tests"
        uses: t-head/ppu-scheduler-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 60
          command: |
            PR_NUMBER="${{ github.event.pull_request.number }}" \
            WHEEL_DIR="${{ env.SOURCE_DIR }}/${{ env.WHEEL_DIR_REL }}" \
            SDK_INSTALL_DIR="/usr/local" \
            PIP_INDEX="${{ env.PIP_INDEX }}" \
            TRITON_INDEX="${{ env.PIP_INDEX }}" \
            TRITON_VERSION="${{ env.TRITON_VERSION }}" \
            bash ${{ env.SOURCE_DIR }}/.ci/ppu/perf_test.sh
