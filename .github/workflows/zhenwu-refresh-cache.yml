name: zhenwu-refresh-cache

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: |
          Leave empty (default) to seed the branch chosen in the "Run workflow"
          dropdown: the normal way to refresh any branch (v2.10.0, v2.11.0, ...)
          with this single file. Only set it to override; a value that differs
          from the selected branch misaligns key vs scope (the cache still lands
          in the selected branch scope but is keyed by this name).
        type: string
        default: ""
      ccache-maxsize:
        description: ccache size limit (board count x branch count x this value must stay within the 10GiB quota)
        type: string
        default: "4G"
      ignore-ccache:
        description: Ignore existing cache and do a cold build to rebuild a clean baseline
        type: boolean
        default: false
      upload-wheel:
        description: Also upload the whl artifact (the main output of this pipeline is the cache, not uploaded by default)
        type: boolean
        default: false
  push:
    branches:
      - 'v2.*'
    paths:
      - '.github/workflows/zhenwu-refresh-cache.yml'
      - '.github/workflows/_zhenwu_build.yml'
      - '.ci/ppu/**'
  schedule:
    - cron: "0 10 * * 5"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh ccache (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        board: ["810", "890"]
    uses: ./.github/workflows/_zhenwu_build.yml
    with:
      board: ${{ matrix.board }}
      source-ref: ${{ inputs.target-branch || '' }}
      cache-branch: ${{ inputs.target-branch || '' }}
      ccache-maxsize: ${{ inputs.ccache-maxsize || '4G' }}
      ignore-ccache: ${{ inputs.ignore-ccache || false }}
      upload-wheel: ${{ inputs.upload-wheel || false }}
      save-ccache: true
      prune-old-ccache: true
      timeout-minutes: 400
