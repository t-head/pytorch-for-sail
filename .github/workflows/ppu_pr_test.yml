name: ppu-pr-test

on:
  pull_request:
    paths:
      - '.github/workflows/_ppu_build.yml'
      - '.github/workflows/ppu_pr_test.yml'
      - '.ci/ppu/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ppu build (890)
    uses: ./.github/workflows/_ppu_build.yml
    with:
      board: "890"
      upload-wheel: true
      save-ccache: true
      timeout-minutes: 400
